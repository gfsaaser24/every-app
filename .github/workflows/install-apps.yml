# Our fork only: install (or update) the apps from
# https://github.com/every-app/awesome-every-app on our Gateway
# (every.titanzero1.com). It runs after every successful Deploy Gateway, and
# from the Actions tab (Run workflow).
#
# Order: the Gateway first, then the apps. It refuses to run while main is
# behind upstream (sync the fork, which redeploys the Gateway and runs this
# again), brings the live Gateway up to this build (`everyapp update` does
# nothing when it already is), and only then installs the apps. Running
# `everyapp install` again updates an app to its latest release; its data stays.
#
# Keys are Gateway settings shared by every app, set from these repository
# secrets when they exist (an unset one leaves the app showing Needs setup):
#   OPENROUTER_API_KEY  OpenSEO (required); OpenMail's default model
#   DATAFORSEO_API_KEY  OpenSEO's SEO data, `login:password` or its base64
#   OPENAI_API_KEY      OpenScribe (required)
name: Install apps

on:
  workflow_run:
    workflows: [Deploy Gateway]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The same group as Deploy Gateway, so an install never overlaps a deploy.
concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  install:
    if: >-
      github.repository == 'gfsaaser24/every-app' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # `everyapp update` checks the commit is on origin/main.
          fetch-depth: 0

      - name: Check main has every upstream change
        run: |
          git fetch --quiet https://github.com/every-app/every-app.git main
          if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            behind=$(git rev-list --count HEAD..FETCH_HEAD)
            echo "::error::main is $behind commits behind every-app/every-app. Sync the fork first: that redeploys the Gateway, then this runs again."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Update the Gateway
        run: pnpm everyapp update --yes

      - name: Set the Gateway's keys
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for name in OPENROUTER_API_KEY DATAFORSEO_API_KEY OPENAI_API_KEY; do
            if [ -n "${!name}" ]; then
              pnpm everyapp secret set "$name" --from-env "$name"
            else
              echo "::warning::$name is not a repository secret; the apps that need it show Needs setup."
            fi
          done

      - name: Install the apps
        run: |
          apps=(
            https://github.com/every-app/open-seo
            https://github.com/every-app/open-crm
            https://github.com/every-app/open-scribe
            https://github.com/every-app/open-analytics
            https://github.com/every-app/open-mail
            # Community app, not reviewed by EveryApp.
            https://github.com/matthewdonsemail-lab/log-everyapp
          )
          failed=()
          for app in "${apps[@]}"; do
            echo "::group::$app"
            pnpm everyapp install "$app" --yes || failed+=("$app")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Not installed: ${failed[*]}"
            exit 1
          fi
