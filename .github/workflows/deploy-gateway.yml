# Our fork only: keep the live Gateway (every.titanzero1.com, Cloudflare
# worker every-app-gateway) on what this repository's main branch holds.
# `everyapp update` runs the D1 migrations (with a restore point), uploads
# the Gateway and rebinds apps; it does nothing when the live Gateway is
# already this build. To take upstream changes: sync the fork, and this runs.
name: Deploy Gateway

on:
  push:
    branches: [main]
    paths:
      - apps/every-app-gateway/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-gateway.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'gfsaaser24/every-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # `everyapp update` checks the commit is on origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update the Gateway
        run: pnpm everyapp update --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
